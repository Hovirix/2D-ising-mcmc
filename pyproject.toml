[project]
name = "2d-ising-mcmc"
version = "0.1.0"
description = "2D Ising Model simulation using Monte Carlo methods"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.124.0",
    "matplotlib>=3.10.7",
    "numpy>=2.3.5",
]

[project.scripts]
2d-ising-mcmc = "ising_mcmc.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ising_mcmc"]

